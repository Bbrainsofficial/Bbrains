name: Bug report
description: Report a bug in BBrains
title: "fix: "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue. Please fill in as much detail as you can.
        **Security vulnerabilities must be reported privately via SECURITY.md, never in a public issue.**
  - type: input
    id: version
    attributes:
      label: BBrains version
      description: Which commit/tag/version are you running? (e.g. v0.1.0, develop @ abc1234)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Mobile app
        - API / backend
        - AI service
        - Infrastructure / Docker
        - Landing page
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack traces
      description: Paste any error output here (sanitize secrets!).
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, node version, etc.
      placeholder: "e.g. Chrome 131 on Windows 11, node 20.18, pnpm 9.15"