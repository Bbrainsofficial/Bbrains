name: Feature request
description: Suggest a new feature or improvement for BBrains
title: "feat: "
labels: ["type:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please search existing issues and the PRD in `docs/prd/`
        to make sure this isn't already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who is it for?
      placeholder: "As a student, I want to ... so that ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature and how you think it should work.
      placeholder: "Describe the desired behavior."
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Affected module
      multiple: true
      options:
        - Authentication / Profiles
        - Courses / Assignments / Grading
        - Gamification
        - Economy / Marketplace
        - Chat / Social
        - Livestream
        - Forum
        - Attendance
        - Library / Canteen
        - Events
        - AI assistant
        - Code runner
        - Whiteboard / Projects
        - Notifications
        - Audit / Admin
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, screenshots, or references.