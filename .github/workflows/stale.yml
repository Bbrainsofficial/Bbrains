name: Stale issues and PRs

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no
            recent activity. It will be closed in 14 days if no further activity occurs.
            If this is still relevant, please leave a comment.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has had
            no recent activity. It will be closed in 14 days if no further activity occurs.
            Push new commits or leave a comment to keep it open.
          close-issue-message: "This issue was closed because it has been inactive. Please reopen if it is still relevant."
          close-pr-message: "This pull request was closed because it has been inactive."
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: "priority:critical,status:confirmed,good first issue"
          exempt-pr-labels: "dependencies"
          remove-stale-when-updated: true